services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      # Pass the variables directly into the build process
      args:
        REACT_APP_API_URL: "http://localhost:8080"
        REACT_APP_DASHBOARD_URL: "http://localhost:3001"
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  dashboard:
    build: 
      context: ./dashboard
      args:
        REACT_APP_API_URL: "http://localhost:8080"
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped